apiVersion: apps/v1
kind: Deployment
metadata:
  name: salok-web
  labels:
    app: salok-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salok-web
  template:
    metadata:
      labels:
        app: salok-web
    spec:
      containers:
        - name: salok-web
          image: ghcr.io/akshatsrii/salok-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

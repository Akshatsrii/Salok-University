apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salok-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Cloudflare handles strict SSL, but nginx needs to know it's behind CF proxy
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://salok.edu"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: salok.edu
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: salok-server-svc
                port:
                  number: 80
          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: salok-ai-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: salok-web-svc
                port:
                  number: 80
